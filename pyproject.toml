[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuaidui-books"
version = "0.1.0"
description = "Pure Python book metadata and answer resource protocol client"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["kuaidui"]

[tool.setuptools.package-data]
kuaidui = ["des_tables.json"]
